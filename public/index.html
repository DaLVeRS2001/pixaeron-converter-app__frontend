<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Pixaeron is an image-processing web application with secure account creation, Google Sign-In, email verification, and password recovery"
    />
    <meta property="og:image" content="/icon-512.png" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Pixaeron — secure image-processing web application</title>
    <script src="/theme-init.js"></script>
    <style type="text/css">
      body {
        margin: 0;
        padding: 0;
      }

      .load-app {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        width: 100vw;
        text-align: center;
        background: #f8fafc;
      }

      [data-theme='dark'] .load-app {
        background: #0b1220;
      }

      .load-app__img {
        width: 3rem;
        height: 3rem;
        border: 0.3125rem solid;
        border-color: #4f46e5 transparent;
        border-radius: 50%;
        display: inline-block;
        box-sizing: border-box;
        animation: rotation 1s linear infinite;
      }

      @keyframes rotation {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="modal-root"></div>
    <div id="notification-root"></div>
    <div id="root">
      <div class="load-app">
        <span class="load-app__img"></span>
      </div>
    </div>
  </body>
</html>
