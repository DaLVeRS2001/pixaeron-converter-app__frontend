type User {
  id: ID!
  email: String!
  username: String!
  emailVerified: Boolean!
}

type RegistrationResult {
  accepted: Boolean!
  email: String!
}

type AuthRequestResult {
  accepted: Boolean!
}

type EmailVerificationResult {
  status: EmailVerificationStatus!
}

enum EmailVerificationStatus {
  VERIFIED
  ALREADY_VERIFIED
  EXPIRED
  INVALID
}

type PasswordResetResult {
  status: PasswordResetStatus!
}

enum PasswordResetStatus {
  RESET
  EXPIRED
  INVALID
  ALREADY_USED
}

type Query {
  me: User!
  conversionBatch(id: ID!, batchToken: String): ConversionBatch!
  conversionEntitlement: ConversionEntitlement!
}

type Mutation {
  login(loginInput: LoginInput!): User!
  register(registerInput: RegisterInput!): RegistrationResult!
  resendEmailVerification(input: EmailActionInput!): AuthRequestResult!
  verifyEmail(input: AuthTokenInput!): EmailVerificationResult!
  requestPasswordReset(input: EmailActionInput!): AuthRequestResult!
  resetPassword(input: ResetPasswordInput!): PasswordResetResult!
  googleLogin(googleLoginInput: GoogleLoginInput!): User!
  refreshSession: Boolean!
  logout: Boolean!
  logoutAll: Boolean!
  createConversionBatch(input: CreateConversionBatchInput!): ConversionBatch!
  completeConversionUploads(input: CompleteConversionUploadsInput!): CompleteConversionUploadsPayload!
}

input LoginInput {
  email: String!
  password: String!
  rememberMe: Boolean
  captchaToken: String
}

input RegisterInput {
  username: String!
  email: String!
  password: String!
  legalConsentAccepted: Boolean
  legalConsentVersion: String
  captchaToken: String
}

input EmailActionInput {
  email: String!
  captchaToken: String
}

input AuthTokenInput {
  token: String!
}

input ResetPasswordInput {
  token: String!
  password: String!
}

input GoogleLoginInput {
  idToken: String!
  rememberMe: Boolean
  captchaToken: String
  legalConsentAccepted: Boolean
  legalConsentVersion: String
}

type ConversionUploadField {
  name: String!
  value: String!
}

type ConversionUploadTarget {
  url: String!
  fields: [ConversionUploadField!]!
}

type ConversionFile {
  id: ID!
  status: ConversionFileStatus!
  inputBytes: Int
  resultKind: ConversionResultKind
  outputBytes: Int
  outputFormat: String
  width: Int
  height: Int
  failureCode: String
  downloadUrl: String
  upload: ConversionUploadTarget
}

enum ConversionFileStatus {
  UPLOADING
  READY
  QUEUED
  PROCESSING
  COMPLETED
  FAILED
  CANCELLED
  EXPIRED
}

enum ConversionResultKind {
  SAVED
  NO_SAVINGS
  SANITIZED_LARGER
}

type ConversionBatch {
  id: ID!
  status: ConversionBatchStatus!
  fileCount: Int!
  expiresAt: DateTime!
  batchToken: String
  files: [ConversionFile!]!
}

enum ConversionBatchStatus {
  UPLOADING
  QUEUED
  PROCESSING
  COMPLETED
  PARTIAL
  FAILED
  CANCELLED
  EXPIRED
}

"""
A date-time string at UTC, such as 2019-12-03T09:54:33Z, compliant with the date-time format.
"""
scalar DateTime

type CompleteConversionUploadsPayload {
  batch: ConversionBatch!
  admittedFiles: Int!
  verifiedFiles: Int!
  missingFiles: Int!
}

type ConversionEntitlement {
  planCode: ConversionPlanCode!
  maxBatchFiles: Int!
  maxFileBytes: Int!
  dailyFiles: Int
  remainingToday: Int
  maxConcurrentFiles: Int!
}

enum ConversionPlanCode {
  ANONYMOUS
  FREE
  LIGHT
  PRO
}

input CreateConversionBatchInput {
  fileCount: Int!
  idempotencyKey: String!
  batchToken: String
}

input CompleteConversionUploadsInput {
  batchId: ID!
  batchToken: String
}
