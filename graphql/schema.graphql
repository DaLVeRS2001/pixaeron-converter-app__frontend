type User {
  id: ID!
  email: String!
  username: String!
  emailVerified: Boolean!
}

type RegistrationResult {
  accepted: Boolean!
  email: String!
}

type AuthRequestResult {
  accepted: Boolean!
}

type EmailVerificationResult {
  status: EmailVerificationStatus!
}

enum EmailVerificationStatus {
  VERIFIED
  ALREADY_VERIFIED
  EXPIRED
  INVALID
}

type PasswordResetResult {
  status: PasswordResetStatus!
}

enum PasswordResetStatus {
  RESET
  EXPIRED
  INVALID
  ALREADY_USED
}

type Query {
  me: User!
}

type Mutation {
  login(loginInput: LoginInput!): User!
  register(registerInput: RegisterInput!): RegistrationResult!
  resendEmailVerification(input: EmailActionInput!): AuthRequestResult!
  verifyEmail(input: AuthTokenInput!): EmailVerificationResult!
  requestPasswordReset(input: EmailActionInput!): AuthRequestResult!
  resetPassword(input: ResetPasswordInput!): PasswordResetResult!
  googleLogin(googleLoginInput: GoogleLoginInput!): User!
  logout: Boolean!
  logoutAll: Boolean!
}

input LoginInput {
  email: String!
  password: String!
  rememberMe: Boolean
  captchaToken: String
}

input RegisterInput {
  username: String!
  email: String!
  password: String!
  legalConsentAccepted: Boolean
  legalConsentVersion: String
  captchaToken: String
}

input EmailActionInput {
  email: String!
  captchaToken: String
}

input AuthTokenInput {
  token: String!
}

input ResetPasswordInput {
  token: String!
  password: String!
}

input GoogleLoginInput {
  idToken: String!
  rememberMe: Boolean
  captchaToken: String
  legalConsentAccepted: Boolean
  legalConsentVersion: String
}
