name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  verify:
    name: Frontend pipeline
    permissions:
      actions: read
      contents: read
    uses: DaLVeRS2001/ci/.github/workflows/pixaeron-frontend.yml@1219b14cd891136a61bc5ff79346fb0f70e996a4
    with:
      graphql_api_url: ${{ vars.GRAPHQL_API_URL }}
      google_client_id: ${{ vars.GOOGLE_CLIENT_ID }}
      turnstile_site_key: ${{ vars.TURNSTILE_SITE_KEY }}

  deploy:
    name: Deploy frontend
    needs: verify
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: pixaeron-frontend-production
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read

    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CLOUDFLARE_ACCOUNT_ID" =~ ^[0-9a-fA-F]{32}$ ]] || { echo 'CLOUDFLARE_ACCOUNT_ID must be a 32-character hexadecimal account ID.' >&2; exit 1; }

      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - name: Install deployment dependencies
        run: npm ci

      - name: Require an empty artifact destination
        shell: bash
        run: |
          set -euo pipefail
          [[ ! -e build ]] || { echo 'Refusing to mix the verified artifact with a pre-existing build directory.' >&2; exit 1; }

      - name: Download verified production assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pixaeron-frontend-${{ github.sha }}
          path: build

      - name: Validate verified static assets
        run: npm run cloudflare:check

      - name: Validate Cloudflare deployment configuration
        run: npm run cloudflare:deploy:dry-run

      - name: Deploy verified static assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$CLOUDFLARE_API_TOKEN" ]] || { echo 'CLOUDFLARE_API_TOKEN is required in the protected production environment.' >&2; exit 1; }
          npm run cloudflare:deploy -- --message "GitHub ${GITHUB_REPOSITORY}@${GITHUB_SHA}"
